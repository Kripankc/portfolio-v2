name: Build Nepal topography

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install rasterio numpy scipy shapely matplotlib pyshp requests
      - run: python scripts/build_topo.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/nepal-topo.svg
          git diff --cached --quiet || git commit -m "data: Nepal contours from Copernicus DEM GLO-90"
          git push
